# Bereinigen (Objekte entfernen) für die Fotos-App – neben Immich, nur CPU, höchstens 2 Kerne.
# Sicher voreingestellt (GitHub-Issues #3, #4): Port nur auf diesem Rechner, ohne Root, schreibgeschützt.
services:
  bereinigen:
    build: .
    container_name: immich_bereinigen
    restart: always
    # Standard: nur dieser Rechner. Für Zugriff aus dem Heimnetz BIND_ADDR=<LAN-IP> setzen (z. B. in einer .env hier).
    ports: ["${BIND_ADDR:-127.0.0.1}:2285:2285"]
    environment:
      THREADS: "2"
      MAX_BODY_MB: "30"
      MAX_CONCURRENT: "2"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    cpus: 2
    mem_limit: 3g
    networks: [immich]
networks:
  immich:
    name: immich_default
    external: true
